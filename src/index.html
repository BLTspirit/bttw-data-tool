<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>BTTW Data Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="brand-dot"></span>BTTW Data</div>
    <nav id="tabs">
      <button data-tab="nodes">Nodes</button>
      <button data-tab="discs">Discs</button>
      <button data-tab="issues">Issues <span id="issue-badge" class="badge"></span></button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div class="spacer"></div>
    <div id="file-label" class="muted"></div>
    <button id="btn-reload" title="Reload game_data.json from disk">Reload</button>
    <button id="btn-save" class="primary" title="Save game_data.json (Ctrl+S)">Save</button>
  </header>
  <main>
    <section id="tab-nodes" class="tab"></section>
    <section id="tab-discs" class="tab"></section>
    <section id="tab-issues" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="tooltip" hidden></div>

  <script src="js/parsers.js"></script>
  <script src="js/model.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tab-nodes.js"></script>
  <script src="js/tab-discs.js"></script>
  <script src="js/tab-issues.js"></script>
  <script src="js/tab-settings.js"></script>
  <script src="js/start.js"></script>
</body>
</html>
